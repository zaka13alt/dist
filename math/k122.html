<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Launcher</title>
    <style>
        /* Sleek dark gray canvas backdrop */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222222;
            font-family: 'Segoe UI', Arial, sans-serif;
            gap: 40px; /* Space between the button and iframe */
        }

        /* Your high-fidelity custom blue gradient button design */
        .action-btn {
            padding: 24px 80px;
            font-size: 24px;
            font-weight: 500;
            border: none;
            border-radius: 18px;
            background: linear-gradient(to right, #00bfff, #007fff);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 0.5px;
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 191, 255, 0.4);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Styling the inline iframe so it's visible and clean */
        .content-frame {
            width: 80%;
            max-width: 800px;
            height: 400px;
            border: 2px solid #007fff;
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <!-- Single centered button -->
    <button id="launcher" class="action-btn">Open in a/b</button>

    <!-- Requested inline iframe placed directly under the button -->
    <iframe class="content-frame" src="https://cdn.esm.sh/gh/zaka13alt/dist/math/blob.html"></iframe>

    <script>
        // Clean event listener implementation 
        document.getElementById('launcher').addEventListener('click', function() {
            // Hardcoded directly to your target Invidious site
            const TARGET_URL = "https://cdn.esm.sh/zaka13alt/dist/math/indexx.html";
            
            // 1. Establish the clean blank tab context first
            const targetWindow = window.open('about:blank', '_blank');
            if (!targetWindow) {
                alert('Pop-up blocker detected. Please allow pop-ups for this page to initialize.');
                return;
            }

            // 2. Generate elements via DOM node creation rather than string parsing
            const doc = targetWindow.document;
            const targetFrame = doc.createElement('iframe');

            // Define source explicitly
            targetFrame.src = TARGET_URL;

            // 3. Apply styles programmatically to fill the new window space
            Object.assign(doc.body.style, {
                margin: '0',
                padding: '0',
                height: '100vh',
                width: '100vw',
                overflow: 'hidden',
                backgroundColor: '#000000'
            });

            Object.assign(targetFrame.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                border: 'none',
                width: '100%',
                height: '100%',
                margin: '0',
                padding: '0',
                zIndex: '9999'
            });

            // Allow media playback and standard full screen permissions inside the iframe window
            targetFrame.setAttribute('allowfullscreen', 'true');
            targetFrame.setAttribute('allow', 'autoplay; fullscreen; pointer-lock; gamepad; camera; microphone');

            // 4. Attach directly to the new frame cleanly
            doc.body.appendChild(targetFrame);
        });
    </script>
</body>
</html>
