<svg xmlns="http://ww.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lumin Games</title>
        <style>
          /* Make the HTML take up the full available SVG space */
          html, body {
            margin: 0;
            padding: 20px;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            box-sizing: border-box;
          }
        </style>
      </head>
      <body>
        <!-- Container where the Lumin SDK will load the content -->
        <div id="games"></div>
        
        <!-- Lumin SDK Script -->
        <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
        <script>
          // Initialize the Lumin SDK
          if (window.Lumin) {
            Lumin.init({ container: '#games', theme: 'dark' });
          }
        </script>
      </body>
    </html>
  </foreignObject>
</svg>
