        .icon-box {

            cursor: pointer;
            transition: 0.2s;
        }

        .icon-box:hover {
            transform: translateX(4px);
            background: rgba(255,255,255,0.18);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            stroke: white;
            fill: none;
        }

        /* SETTINGS PANEL */
        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background: #111;
            border-left: 1px solid rgba(255,255,255,0.15);
            transform: translateX(100%);
            transition: 0.3s ease;
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 998;
        }

        .settings-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel button {
            width: 100%;
            margin-bottom: 10px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;

<script>
particlesJS("particles-js", {
    particles: {
        number: { value: 70 },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: { value: 0.4 },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 140, color: "#ffffff" },
        move: { enable: true, speed: 2 }
    }
});

function loadIframe(url) {
    const title = document.getElementById("welcomeTitle");
    const wrapper = document.getElementById("iframeWrapper");
    const iframe = document.getElementById("mainIframe");

    title.style.display = "none";
    wrapper.style.display = "block";

    iframe.src = url;
}

window.addEventListener("DOMContentLoaded", () => {
    window.toggleSettings = function () {
        document.getElementById("settingsPanel").classList.toggle("open");
        document.querySelector(".settings-overlay").classList.toggle("show");
    };
});
</script>
